<title>HAYATE soundtrack synth</title>

  { const s = ctx.createBufferSource(); s.buffer = pb; s.loop = true; const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 230; const g = ctx.createGain(); g.gain.setValueAtTime(0, C.quiet - 0.05); g.gain.linearRampToValueAtTime(0.36, C.quiet + 1.2); g.gain.setValueAtTime(0.36, C.card - 0.2); g.gain.linearRampToValueAtTime(0, D - 0.3); const lfo = ctx.createOscillator(); lfo.frequency.value = 0.31; const lg = ctx.createGain(); lg.gain.value = 0.12; lfo.connect(lg); lg.connect(g.gain); s.connect(lp); lp.connect(g); g.connect(Bamb); s.start(C.quiet - 0.05); s.stop(D); lfo.start(C.quiet); lfo.stop(D); const horn = (t) => { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(180, t); o.frequency.linearRampToValueAtTime(172, t + 1.1); const gh = ctx.createGain(); gh.gain.setValueAtTime(0, t); gh.gain.linearRampToValueAtTime(0.025, t + 0.3); gh.gain.setValueAtTime(0.025, t + 0.7); gh.gain.linearRampToValueAtTime(0, t + 1.1); const lph = ctx.createBiquadFilter(); lph.type = 'lowpass'; lph.frequency.value = 420; o.connect(lph); lph.connect(gh); gh.connect(Bamb); o.start(t); o.stop(t + 1.15); }; horn(C.quiet + 2.6); horn(C.deflate + 0.9); }
